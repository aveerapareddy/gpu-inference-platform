[project]
name = "gpu-inference-api-gateway"
version = "0.1.0"
description = "OpenAI-compatible HTTP surface"
requires-python = ">=3.11"
dependencies = [
    "gpu-inference-common-schemas>=0.1.0",
    "gpu-inference-observability>=0.1.0",
    "gpu-inference-control-plane>=0.1.0",
    "gpu-inference-scheduler>=0.1.0",
    "gpu-inference-adapter>=0.1.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "mypy>=1.8", "ruff>=0.3"]

[project.scripts]
gpu-inference-gateway = "api_gateway.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_gateway"]

[tool.uv.sources]
gpu-inference-common-schemas = { path = "../../packages/common-schemas", editable = true }
gpu-inference-observability = { path = "../../packages/observability", editable = true }
gpu-inference-control-plane = { path = "../control-plane", editable = true }
gpu-inference-scheduler = { path = "../scheduler", editable = true }
gpu-inference-adapter = { path = "../inference-adapter", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
