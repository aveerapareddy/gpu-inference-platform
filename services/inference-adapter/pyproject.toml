[project]
name = "gpu-inference-adapter"
version = "0.1.0"
description = "Inference backend integration layer"
requires-python = ">=3.11"
dependencies = [
    "gpu-inference-common-schemas>=0.1.0",
    "gpu-inference-observability>=0.1.0",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
]

[project.scripts]
gpu-inference-adapter = "inference_adapter.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_adapter"]

[tool.uv.sources]
gpu-inference-common-schemas = { path = "../../packages/common-schemas", editable = true }
gpu-inference-observability = { path = "../../packages/observability", editable = true }
