[project]
name = "gpu-inference-observability"
version = "0.1.0"
description = "Logging, tracing, and metrics contracts for GPU Inference Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prometheus-client>=0.21,<1",
    "opentelemetry-api>=1.28,<2",
    "opentelemetry-sdk>=1.28,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
]

[project.optional-dependencies]
dev = ["mypy>=1.8", "ruff>=0.3"]
gpu = ["nvidia-ml-py>=12.535,<13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_inference_observability"]

[tool.ruff]
line-length = 100
target-version = "py311"
